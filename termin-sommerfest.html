<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sommerfest 08.08.2026</title>
  <style>
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: #f7f7f2;
      color: #183126;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
    }

    .top {
      margin-bottom: 16px;
    }

    a {
      color: #2f7d4b;
      text-decoration: none;
      font-weight: 700;
    }

    .card {
      border-radius: 24px;
      padding: 44px 30px;
      background: linear-gradient(135deg, #fff4d9, #ffe9b8);
      box-shadow: 0 20px 60px rgba(24,49,38,.12);
    }

    .small {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #7a6400;
      margin-bottom: 16px;
    }

    .big {
      font-size: clamp(2.4rem, 6vw, 4.6rem);
      font-weight: 900;
      line-height: 1.02;
      margin-bottom: 18px;
    }

    .date {
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 800;
      color: #8a5a00;
      margin-bottom: 14px;
    }

    .note {
      font-size: 1.06rem;
      line-height: 1.8;
      color: #5b6d62;
      max-width: 52ch;
    }

    @media (max-width: 640px) {
      .wrap {
        padding: 14px;
      }

      .card {
        padding: 28px 20px;
        border-radius: 18px;
      }

      .small {
        font-size: .9rem;
        margin-bottom: 10px;
      }

      .big {
        font-size: 2.2rem;
        margin-bottom: 12px;
      }

      .date {
        font-size: 1.1rem;
      }

      .note {
        font-size: .96rem;
        line-height: 1.6;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top"><a href="termine.html">← Zurück zu den Terminen</a></div>
    <div class="card">
      <div class="small">Save the Date</div>
      <div class="big">Sommerfest</div>
      <div class="date">08.08.2026</div>
      <div class="note">
        Bitte jetzt schon vormerken.<br>
        Weitere Informationen zum Sommerfest folgen später.
      </div>
    </div>
  </div>
</body>
</html>
